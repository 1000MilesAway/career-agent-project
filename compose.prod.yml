# Production stack: database, API, worker.
#
#   docker compose -f compose.prod.yml up -d --build
#
# Kept separate from compose.yml, which is the development database alone. One
# file with profiles would mean a stray `docker compose up` on a laptop tries
# to build and run the whole stack.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:-career}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No ports section on purpose: the database is reachable only from the
    # compose network. Exposing 5432 on a host with a public IP is how a
    # Postgres ends up in someone else's botnet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career} -d ${POSTGRES_DB:-career}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-career}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-career}
      # Which revision this container serves, surfaced by /api/health. Set by
      # deploy.sh from the checkout; "unknown" when someone starts the stack by
      # hand, which is the truth and must not be mistaken for a sha.
      GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      # Bound to the host's public interface deliberately: this deployment is
      # tested by IP, with no domain and therefore no TLS terminator in front.
      # Everything on this port travels in clear text — see docs/decisions.md.
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    # The cabinet: a React build served by nginx, which also proxies /api to
    # the api container. Separate from the API image on purpose — the bundle
    # needs Node to build and nothing to run, and rebuilding the Python image
    # to change a stylesheet would be a Python rebuild for a CSS change.
    build: ./frontend
    restart: unless-stopped
    ports:
      # Port 80, so the cabinet is just the host's address. The API stays on
      # 8000 as well: /api/health is checked from outside by deploy.sh, and
      # taking that away would break the deploy's only proof it worked.
      - "80:80"
    depends_on:
      - api

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-career}
      GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
