[project]
name = "career-agent"
version = "0.0.0"
description = "Пробник career-agent: оценка вакансий по резюме с замером стоимости"
requires-python = ">=3.12"
dependencies = [
    # LLM: OpenAI-совместимый клиент, base_url смотрит на DeepSeek.
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    # Источники вакансий: HTTP + разбор HTML страницы вакансии.
    "httpx>=0.28.1",
    "selectolax>=0.4.11",
    # Разбор резюме: PDF и DOCX.
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    # Веб-экран пробника. python-multipart обязателен: web.py принимает Form/UploadFile.
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pydantic-settings>=2",
    "pwdlib[bcrypt]>=0.3.1",
    "pyjwt[crypto]>=2.14.0",
    "email-validator>=2.3.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

# app/ и core/ импортируются из корня репозитория и дистрибутивом не являются:
# собирать нечего, поэтому build-system не нужен.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI-зависимости (File/Form) задаются именно так.
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
# Пакеты не устанавливаются в окружение (package = false), поэтому isort не
# определит их как свои сам — перечисляем явно, иначе импорты из одного пакета
# разъезжаются по разным блокам при каждом --fix.
known-first-party = ["app", "core", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Короткие трейсбеки: на падении агент читает вывод целиком, и long-трейсбек
# стоит контекста, не добавляя информации к short.
addopts = ["--tb=short", "--no-header"]
# app/ и core/ не устанавливаются в окружение (package = false), поэтому корень
# репозитория добавляем в sys.path явно — иначе импорты не находятся.
pythonpath = ["."]
