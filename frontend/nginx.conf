server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The cabinet loads nothing from anywhere else, and says so.
    #
    # These live at server level AND are repeated in every location that has
    # an add_header of its own: nginx does not merge add_header across
    # levels — a single one inside a location drops every inherited header.
    # Without the repetition, index.html came back with no X-Frame-Options at
    # all, which is exactly the page that must not be framed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Hashed filenames, so a bundle can be cached indefinitely: a new build
    # produces new names rather than new contents under the old ones.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html is the one file that must never be cached: it is what points
    # at the hashed bundles, and a stale copy pins the browser to a deleted one.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # The API lives in the api container on the same compose network. Proxying
    # it keeps the browser on one origin, so the token never travels as a
    # cross-site request and CORS stays out of production entirely.
    location /api/ {
        # Docker's embedded DNS, plus the upstream held in a variable.
        #
        # A literal `proxy_pass http://api:8000` is resolved once, at startup,
        # and nginx REFUSES TO START if the name does not resolve yet:
        # "host not found in upstream". depends_on only orders the starts, so
        # a slow api container takes the cabinet down with it — and it stays
        # down, because the failure is a crash and not a retry. Through a
        # variable the name is resolved per request instead.
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full evaluation takes up to a minute and a scan longer; the 60s
        # default would cut one off and show the user a 504 for work the
        # server actually completed and charged for.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /docs and /openapi.json belong to FastAPI too, and are useful in the
    # browser when checking what the API promises.
    location ~ ^/(docs|redoc|openapi\.json) {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $api_docs http://api:8000;
        proxy_pass $api_docs;
        proxy_set_header Host $host;
    }

    # The cabinet routes on paths (/search, /login…): every one of them is
    # index.html, and the router inside picks the screen.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # `any`: every request reaches this nginx through Caddy, which adds a Via
    # header, and with the default (`off`) nginx compresses nothing that came
    # through a proxy. /api/state went out as 0.5 MB of raw JSON for that.
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
