name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      # No DEEPSEEK_API_KEY here on purpose: live LLM calls in tests are
      # forbidden by the project conventions. A test that needs the key is a bug.
      - name: Tests
        run: uv run pytest -q
