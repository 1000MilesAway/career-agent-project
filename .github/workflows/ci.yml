name: CI

# A bare `push:` plus `pull_request:` ran the whole suite twice for every
# commit on every branch, and each failure mailed the author. Work branches
# are checked through their pull request; a direct push is checked only on the
# trunk, where nobody opens a PR against themselves.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A branch pushed three times in a minute needs one answer, not three.
  # Older runs for the same ref are cancelled instead of mailing about code
  # that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The product tests run against a real Postgres: the schema uses JSONB
      # and a partial unique index, and SQLite would pass tests that Postgres
      # would fail. Without this service they skip rather than fail, so a
      # missing database here would quietly stop testing the database layer.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U career"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Pinned, because `requires-python = ">=3.12"` lets uv pick the
          # newest interpreter it can find. That version moves on its own
          # schedule, so the suite could start failing here on a day nobody
          # touched the code, and the failure would not reproduce locally.
          python-version: "3.12"

      - name: Install dependencies
        # --frozen: install exactly uv.lock and fail if it drifted from
        # pyproject.toml, rather than quietly resolving something newer that
        # was never tested.
        run: uv sync --group dev --frozen

      - name: Lint
        run: uv run ruff check .

      # No DEEPSEEK_API_KEY here on purpose: live LLM calls in tests are
      # forbidden by the project conventions. A test that needs the key is a bug.
      #
      # SECRET_KEY is set because app/main.py refuses to start without one, and
      # that refusal errored 27 tests here while the suite stayed green on any
      # machine with a .env — which .gitignore keeps out of the repository.
      # tests/conftest.py now defaults both values too; this stays so the
      # workflow does not depend on a fixture to be runnable.
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://career:career@localhost:5433/career_test
          SECRET_KEY: ci-not-a-real-key-0123456789abcdef
        run: uv run pytest -q

      - name: Migrations apply to an empty database
        # Catches a model changed without a migration, which the test suite
        # cannot see: it builds the schema from the models, not from Alembic.
        env:
          DATABASE_URL: postgresql+asyncpg://career:career@localhost:5433/career
          SECRET_KEY: ci-not-a-real-key
        run: uv run alembic upgrade head
