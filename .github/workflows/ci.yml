name: CI

# A bare `push:` plus `pull_request:` ran the whole suite twice for every
# commit on every branch, and each failure mailed the author. Work branches
# are checked through their pull request.
#
# No `push: main` here: Deploy calls this workflow as its own first job, so a
# push to main would otherwise run the suite twice over — once on its own and
# once inside the deploy.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  # A branch pushed three times in a minute needs one answer, not three.
  # Older runs for the same ref are cancelled instead of mailing about code
  # that has already been replaced.
  #
  # Keyed by workflow too: called from Deploy this shares `github.ref` with
  # the deploy run, and without the distinction one would cancel the other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The product tests run against a real Postgres: the schema uses JSONB
      # and a partial unique index, and SQLite would pass tests that Postgres
      # would fail. Without this service they skip rather than fail, so a
      # missing database here would quietly stop testing the database layer.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U career"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Both run on node24. The v4/v5 pair targeted node20, which GitHub is
      # retiring: it already forces them onto node24 and warns, and the warning
      # is the notice that one day it stops forcing and starts failing.
      #
      # setup-uv is v7, not v10: its releases have reached 10.x, but the
      # floating major tags stop at v7, and a workflow can only name a tag
      # that exists. Read the tags, not the release list.
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Pinned, because `requires-python = ">=3.12"` lets uv pick the
          # newest interpreter it can find. That version moves on its own
          # schedule, so the suite could start failing here on a day nobody
          # touched the code, and the failure would not reproduce locally.
          python-version: "3.12"

      - name: Install dependencies
        # --frozen: install exactly uv.lock and fail if it drifted from
        # pyproject.toml, rather than quietly resolving something newer that
        # was never tested.
        run: uv sync --group dev --frozen

      - name: Lint
        run: uv run ruff check .

      # No DEEPSEEK_API_KEY here on purpose: live LLM calls in tests are
      # forbidden by the project conventions. A test that needs the key is a bug.
      #
      # SECRET_KEY is set because app/main.py refuses to start without one, and
      # that refusal errored 27 tests here while the suite stayed green on any
      # machine with a .env — which .gitignore keeps out of the repository.
      # tests/conftest.py now defaults both values too; this stays so the
      # workflow does not depend on a fixture to be runnable.
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://career:career@localhost:5433/career_test
          SECRET_KEY: ci-not-a-real-key-0123456789abcdef
        run: uv run pytest -q

      - name: Migrations apply to an empty database
        # Catches a model changed without a migration, which the test suite
        # cannot see: it builds the schema from the models, not from Alembic.
        env:
          DATABASE_URL: postgresql+asyncpg://career:career@localhost:5433/career
          SECRET_KEY: ci-not-a-real-key
        run: uv run alembic upgrade head

  # The cabinet, checked separately: it shares no runtime with the API and
  # needs no database, so pinning it to the job above would only make both
  # wait for each other. A broken build must fail here — the deploy builds
  # the image itself, and a type error would otherwise surface as a failed
  # `docker build` on the server with a rollback and no explanation.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      # v7, checked against the tag list rather than the release page — the
      # same trap that once failed this workflow on a setup-uv v10 that has
      # releases but no floating major tag.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci, not npm install: installs exactly package-lock.json and fails
      # if it drifted from package.json, instead of quietly resolving
      # something newer that was never tested.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # All three TS projects, tests included — `npm run build` checks only
      # what ships, so a broken test file would otherwise pass unnoticed.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
